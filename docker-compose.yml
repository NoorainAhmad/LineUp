services:
  # --- Database Services ---
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgresql_admin
      POSTGRES_PASSWORD: postgresql_password_123
      POSTGRES_DB: lineup
    ports:
      - "5433:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql/data 

  # --- Cache Services ---
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_db_data:
  redis_data: 