server {
    server_name lineup24x7.com;

    root /var/www/lineup;
    index index.html;

    # Serve React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → Node (PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Basic security headers (safe defaults)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/lineup24x7.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/lineup24x7.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = lineup24x7.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name lineup24x7.com;
    return 404; # managed by Certbot


}